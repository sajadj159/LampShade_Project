version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lampshade-api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__LampShadeDb=Host=postgres;Database=LampShadeDb;Username=lampshade_user;Password=LampShade@1234
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: lampshade-postgres
    environment:
      - POSTGRES_DB=LampShadeDb
      - POSTGRES_USER=lampshade_user
      - POSTGRES_PASSWORD=LampShade@1234
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lampshade_user -d LampShadeDb"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
