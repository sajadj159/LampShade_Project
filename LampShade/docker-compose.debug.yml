version: '3.8'

# Usage:
#   docker compose -f docker-compose.debug.yml up --build
#
# This runs ONLY the debug profile:
#   - API: http://localhost:5001
#   - Swagger: http://localhost:5001/swagger
#   - Debug port: 9229 (attach VS Code / Rider)

services:
  app-debug:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_CONFIG: Debug
    container_name: lampshade-api-debug
    ports:
      - "5001:8080"
      - "5002:9229"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__LampShadeDb=Host=postgres;Database=LampShadeDb;Username=lampshade_user;Password=LampShade@1234
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: lampshade-postgres-debug
    environment:
      - POSTGRES_DB=LampShadeDb
      - POSTGRES_USER=lampshade_user
      - POSTGRES_PASSWORD=LampShade@1234
    ports:
      - "5433:5432"
    volumes:
      - postgres-debug-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lampshade_user -d LampShadeDb"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-debug-data:
