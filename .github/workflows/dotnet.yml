# Builds the modular monolith and runs every test suite:
# unit tests per module, architecture tests that guard module boundaries,
# and integration tests that boot all modules against PostgreSQL (Testcontainers, Docker is preinstalled on ubuntu-latest).

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore LampShade/LampShade.sln
    - name: Build
      run: dotnet build LampShade/LampShade.sln --no-restore
    - name: Unit tests
      run: dotnet test LampShade/LampShade.sln --no-build --verbosity normal --filter "FullyQualifiedName!~LampShade.IntegrationTests&FullyQualifiedName!~LampShade.ArchitectureTests"
    - name: Architecture tests
      run: dotnet test LampShade/tests/LampShade.ArchitectureTests --no-build --verbosity normal
    - name: Integration tests
      run: dotnet test LampShade/tests/LampShade.IntegrationTests --no-build --verbosity normal
